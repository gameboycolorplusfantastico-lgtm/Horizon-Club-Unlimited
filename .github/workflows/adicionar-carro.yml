name: Adicionar carro a partir de GLB
# Envie um .glb (e, se quiser, um .json com o mesmo nome) para a pasta novos-carros/ e este action
# empacota o carro, registra em assets/cars/cars.json e apaga o .glb. O carro aparece no jogo sozinho.
on:
  push:
    paths:
      - 'novos-carros/*.glb'
      - 'novos-carros/*.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  carro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install numpy pillow
      - run: python3 tools/processar_novos_carros.py
      - name: Salvar no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nada para salvar"; exit 0; fi
          git commit -m "Novo carro empacotado automaticamente"
          git push
