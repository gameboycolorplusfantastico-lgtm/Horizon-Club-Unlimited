name: Adicionar carro a partir de GLB
# Envie um .glb (e, se quiser, um .json com o mesmo nome) para a pasta novos-carros/.
# Alterar tools/specs_manual.json tambem dispara o robo (reaplica os dados reais nos carros ja cadastrados).
# O robo empacota o carro, PESQUISA os dados reais na internet (potencia, peso, tracao, vel. maxima),
# ajusta a fisica e registra em assets/cars/cars.json. Depois apaga o .glb.
on:
  push:
    paths:
      - 'novos-carros/*.glb'
      - 'novos-carros/*.json'
      - 'tools/specs_manual.json'
  workflow_dispatch:
    inputs:
      atualizar:
        description: 'Pesquisar de novo carros JA cadastrados: "todos" ou ids separados por virgula (deixe vazio para nao fazer nada)'
        required: false
        default: ''
      simular:
        description: 'Apenas simular (mostra o que mudaria, sem gravar)'
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: carros
  cancel-in-progress: false
jobs:
  carro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pillow
      - name: Empacotar carro e buscar dados reais
        env:
          # opcional (GRATIS): cadastre o segredo GEMINI_API_KEY (chave gratuita em aistudio.google.com) para a pesquisa ficar bem melhor
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # opcional (pago): ANTHROPIC_API_KEY
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ATUALIZAR: ${{ github.event.inputs.atualizar }}
          SIMULAR: ${{ github.event.inputs.simular }}
        run: python3 tools/processar_novos_carros.py
      - name: Salvar no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "Nada para salvar"; exit 0; fi
          git commit -m "Novo carro empacotado automaticamente"
          git pull --rebase origin "${GITHUB_REF_NAME}" || true
          git push
